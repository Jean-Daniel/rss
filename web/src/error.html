<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Error · Fever</title>
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				display: grid;
				place-items: center;
				min-height: 100vh;
				margin: 0;
				background: #f2f2f0;
				color: #1d1d1f;
				font:
					14px/1.45 system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
				text-align: center;
			}
			.card {
				max-width: 380px;
				padding: 28px 24px;
				border-radius: 12px;
				background: #fff;
				box-shadow: 0 0 0 1px rgb(0 0 0 / 0.08);
			}
			.button {
				display: inline-block;
				padding: 10px 20px;
				border-radius: 8px;
				background: #1d1d1f;
				color: #fff;
				font-weight: 600;
				text-decoration: none;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background: #161618;
					color: #ececee;
				}
				.card {
					background: #222224;
					box-shadow: 0 0 0 1px rgb(255 255 255 / 0.09);
				}
				.button {
					background: #ececee;
					color: #161618;
				}
			}
		</style>
	</head>
	<body>
		<div class="card">
			<h1>Something went wrong (%sveltekit.status%)</h1>
			<p>%sveltekit.error.message%</p>
			<!-- A link, not a script: the page's Content Security Policy blocks inline handlers. -->
			<a class="button" href="">Try again</a>
		</div>
	</body>
</html>
